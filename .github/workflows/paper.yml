name: paper

on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: erdos-gyarfas-paper
          path: paper/main.pdf
