[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos-gyarfas"
version = "1.0.0"
description = "Exact power-of-two cycle checker for the Erdős–Gyárfás conjecture"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Denis-Alexandru Ionescu-Telibasa" }]
dependencies = []

[project.optional-dependencies]
figures = ["networkx>=3.0", "matplotlib>=3.7"]
dev = ["pytest>=7", "networkx>=3.0"]

[project.scripts]
egcheck = "erdos_gyarfas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
